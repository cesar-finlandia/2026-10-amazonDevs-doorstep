<!doctype html>
<!-- Requirement IDs: HEE-KIT-01 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>three-scene kit vanilla demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #23262b; font-family: system-ui, sans-serif; }
      #app { display: flex; height: 100vh; }
      #side { width: 220px; padding: 12px; background: #1b1e22; color: #e8eaed; overflow-y: auto; }
      #side button { width: 100%; text-align: left; background: transparent; color: #e8eaed; border: 1px solid #43474e; border-radius: 4px; padding: 4px 8px; margin-bottom: 4px; cursor: pointer; }
      #stage { flex: 1; }
      #stage canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="side">
        <h1 style="font-size: 16px">Widget bay (vanilla)</h1>
        <div id="shots"></div>
        <ul id="entities" style="list-style: none; padding: 0"></ul>
      </div>
      <div id="stage"></div>
    </div>
    <script type="module" src="/src/demo/vanilla.ts"></script>
  </body>
</html>
